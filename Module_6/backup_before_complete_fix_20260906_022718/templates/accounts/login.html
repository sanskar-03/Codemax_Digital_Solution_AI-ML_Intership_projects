{% extends "base.html" %}

{% block title %}
Sign in | TravelShield
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="eyebrow">
                ACCOUNT ACCESS
            </div>

            <h1>
                Sign in
            </h1>

            <p>
                Access your travel assessments and reports.
            </p>

        </div>


        <form method="post" class="auth-form">

            {% csrf_token %}

            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="button button-primary button-full"
            >
                Sign in
            </button>

        </form>


        <div class="auth-footer">

            <p>
                New to TravelShield?
            </p>

            <a href="{% url 'register' %}">
                Create an account
            </a>

        </div>

    </div>

</section>

{% endblock %}
