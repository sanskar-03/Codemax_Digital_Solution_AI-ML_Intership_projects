{% extends "base.html" %}

{% block content %}

<div class="page-shell narrow-shell">

    <section class="form-page-heading">

        <div class="eyebrow">
            <span></span>
            {{ subject.name|upper }}
        </div>

        <h1>Add a learning topic.</h1>

        <p>
            Create a focused step inside your roadmap.
        </p>

    </section>

    <form method="post" class="form-card app-form">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="button-row">

            <button class="btn btn-primary">
                Add topic →
            </button>

            <a
                href="{% url 'learning:subject_detail' subject.id %}"
                class="btn btn-outline"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
